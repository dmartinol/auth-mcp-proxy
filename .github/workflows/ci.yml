name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check auth_mcp_proxy tests
          ruff format --check auth_mcp_proxy tests

      - name: Typecheck
        run: mypy auth_mcp_proxy

      - name: Test
        run: pytest -q
